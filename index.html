<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Andy's Ride Guide</title>
<meta name="description" content="An unofficial guide to every Walt Disney World ride, ranked from gentlest to wildest for a rider who would rather skip the spinning and the heights.">
<meta property="og:title" content="Andy's Ride Guide">
<meta property="og:description" content="Every Walt Disney World ride, gentlest to wildest, with live waits, a map and a one-pager for each.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pjones7-del.github.io/ride-guide/">
<meta property="og:image" content="https://pjones7-del.github.io/ride-guide/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
:root{
--paper:#F1F4F2; --card:#fff; --ink:#111416; --ink2:#4B555A; --rule:#CBD3CF; --soft:#E3E9E5;
--l1:#1F8A4C; --l2:#1F6FB8; --l3:#F2C230; --l4:#E8742A; --l5:#C62828;
--body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
--bar:52px; --tabs:60px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);padding-bottom:calc(var(--tabs) + env(safe-area-inset-bottom))}
h1,h2,h3,h4{font-family:var(--cond);font-weight:700;line-height:1.02;margin:0;letter-spacing:.005em}
p{margin:0 0 .8em}
a{color:inherit;text-underline-offset:.15em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #000;outline-offset:2px;border-radius:2px}
.band :focus-visible,.hero :focus-visible,.tabs :focus-visible,.sheetbar :focus-visible{outline-color:#fff}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.band{position:sticky;top:0;z-index:30;background:#000;color:#fff;height:var(--bar);display:flex;align-items:center;gap:12px;padding:0 16px}
.band .title{font:700 23px/1 var(--cond);letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.band .live{margin-left:auto;font:400 13px/1.2 var(--body);color:#C9D2CD;text-align:right;background:none;border:0;padding:6px 0;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#6B7570;flex:none}
.dot.on{background:#43D07F}
.dot.off{background:#E8742A}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#000;display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #2a2a2a}
.tabs button{flex:1;height:var(--tabs);background:none;border:0;color:#B9C2BD;font:600 14px/1 var(--cond);letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:#fff;box-shadow:inset 0 3px 0 var(--l3)}
.hero{background:#000;color:#fff;padding:22px 0 26px}
.hero h1{font-size:clamp(46px,13.5vw,84px);line-height:.9;letter-spacing:-.005em;margin:0 0 14px}
.hero p{font-size:18px;line-height:1.42;max-width:34em;color:#E7ECE9;margin-bottom:22px}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0;padding:0;list-style:none}
.legend li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.legend svg{width:clamp(40px,12vw,58px);height:auto}
.legend b{font:600 clamp(14px,3.9vw,18px)/1.05 var(--cond);letter-spacing:.01em}
.legend span{display:none;font-size:13px;line-height:1.3;color:#C9D2CD}
.hero .note{margin:20px 0 0;font-size:15px;color:#C9D2CD;max-width:36em}
.filters{position:sticky;top:var(--bar);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.filters .wrap{display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 13px;font:600 16px/1 var(--cond);letter-spacing:.01em;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.opts{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--ink2)}
.opts label{display:flex;align-items:center;gap:6px}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:#000;margin:0}
.opts select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:4px 6px}
.opts .count{margin-left:auto;font-variant-numeric:tabular-nums}
.lvlhead{display:flex;align-items:center;gap:12px;padding:22px 0 10px}
.lvlhead svg{width:34px;height:34px;flex:none}
.lvlhead h2{font-size:28px}
.lvlhead p{margin:2px 0 0;font-size:15px;line-height:1.35;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:0;background:var(--card);border-top:1px solid var(--rule)}
.rows li{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:11px 12px;min-height:68px}
.row:active{background:var(--soft)}
.row .sign{width:40px;height:40px}
.row h3{font:600 21px/1.08 var(--cond);letter-spacing:.005em}
.row .meta{font-size:13.5px;line-height:1.3;color:var(--ink2);margin-top:2px}
.pips{display:flex;gap:10px;margin-top:6px;font:400 12.5px/1 var(--body);color:var(--ink2);align-items:center;white-space:nowrap}
.pips span{display:inline-flex;align-items:center;gap:5px}
.pip{display:inline-flex;gap:2px}
.pip i{width:8px;height:7px;background:#D5DDD8;border-radius:1px}
.pip i.f{background:var(--ink)}
.pip i.h{background:linear-gradient(90deg,var(--ink) 50%,#D5DDD8 50%)}
.wait{text-align:right;min-width:52px;font:700 26px/1 var(--cond);font-variant-numeric:tabular-nums}
.wait small{display:block;font:400 12px/1.1 var(--body);color:var(--ink2);margin-top:2px}
.wait.txt{font:600 14px/1.15 var(--cond);color:var(--ink2);max-width:64px}
.row.closed h3,.row.closed .meta{color:#6C7579}
.tape{margin:26px 0 0;border:0;padding:0}
.tape i{display:block;height:12px;background:repeating-linear-gradient(-45deg,#000 0 12px,var(--l3) 12px 24px)}
.tape p{margin:10px 0 0;font-size:15.5px;line-height:1.4}
.tape b{font:700 22px/1 var(--cond);display:block;margin-bottom:3px}
.empty{padding:28px 0;color:var(--ink2)}
.foot{padding:28px 0 36px;font-size:14px;line-height:1.5;color:var(--ink2)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet[hidden]{display:none}
.sheetbar{position:sticky;top:0;z-index:5;background:#000;color:#fff;height:var(--bar);display:flex;align-items:center;gap:8px;padding:0 8px}
.sheetbar button{background:none;border:0;color:#fff;height:44px;min-width:44px;padding:0 10px;font:600 17px/1 var(--cond);display:flex;align-items:center;gap:6px}
.sheetbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sheetbar .sp{flex:1}
.sheetbar .rank{font:600 16px/1 var(--cond);color:#C9D2CD;padding-right:8px}
.op{max-width:760px;margin:0 auto;background:var(--card);padding-bottom:28px}
.photo{position:relative;aspect-ratio:16/9;background:#1b1f21;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.none{aspect-ratio:auto;height:14px;background:repeating-linear-gradient(-45deg,#000 0 12px,#1d2224 12px 24px)}
.credit{font-size:12px;line-height:1.35;color:var(--ink2);padding:6px 16px 0}
.op .pad{padding:0 16px}
.lvl{display:flex;align-items:center;gap:12px;margin:16px 0 10px}
.lvl svg{width:48px;height:48px;flex:none}
.lvl b{font:700 24px/1 var(--cond);display:block}
.lvl span{font-size:14px;color:var(--ink2);line-height:1.3;display:block;margin-top:3px}
.op h2{font-size:clamp(34px,9.5vw,46px);line-height:.98;margin:2px 0 6px}
.op .where{font-size:15px;color:var(--ink2);margin:0 0 12px}
.status{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:4px;padding:4px 8px;font:600 15px/1.1 var(--cond);letter-spacing:.01em}
.tag.solid{background:var(--ink);color:#fff}
.tag.warn{border-color:var(--l5);color:#9E1B1B}
.alert{border-left:6px solid var(--l4);background:#FFF3E6;padding:10px 12px;font-size:15.5px;line-height:1.4;margin:0 0 14px}
.alert.closed{border-color:var(--l5);background:#FDECEC}
.alert.info{border-color:var(--l2);background:#EAF2FB}
.verdict{font:600 22px/1.25 var(--cond);margin:0 0 16px;letter-spacing:.003em}
.meters{display:grid;gap:7px;margin:0 0 6px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.meter{display:grid;grid-template-columns:122px 1fr 30px;align-items:center;gap:10px;font-size:15px}
.meter .lab{font-weight:600}
.meter.minor .lab{font-weight:400;color:var(--ink2)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.segs i{height:12px;background:var(--soft);border-radius:2px}
.segs i.f{background:var(--ink)}
.segs i.h{background:linear-gradient(90deg,var(--ink) 50%,var(--soft) 50%)}
.meter.minor .segs i{height:8px}
.meter .val{text-align:right;font:600 17px/1 var(--cond);font-variant-numeric:tabular-nums}
.driver{font-size:13.5px;color:var(--ink2);margin:6px 0 18px}
.op h4{font-size:21px;margin:20px 0 6px}
.op p{font-size:16.5px;line-height:1.5}
.two{display:grid;gap:0 20px}
.tips{margin:0;padding:0;list-style:none}
.tips li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--rule);font-size:16.5px;line-height:1.42}
.tips li:first-child{border-top:0}
.tips li::before{content:"";position:absolute;left:2px;top:17px;width:9px;height:9px;background:var(--ink);border-radius:50%}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0;border-top:1px solid var(--rule)}
.facts div{padding:8px 0;border-bottom:1px solid var(--rule)}
.facts dt{font-size:13px;color:var(--ink2);line-height:1.2}
.facts dd{margin:2px 0 0;font:600 19px/1.15 var(--cond)}
.facts dd small{font:400 12.5px/1.25 var(--body);color:var(--ink2);display:block;margin-top:2px}
.gauge{margin:14px 0 2px}
.gauge svg{width:100%;height:auto;display:block}
.gauge text{font-family:var(--body);font-size:12px;fill:var(--ink2)}
.gauge .bl{font-family:var(--cond);font-weight:600;font-size:15px;fill:var(--ink)}
.small{font-size:13px;line-height:1.45;color:var(--ink2)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.flags span{background:var(--soft);border-radius:3px;padding:3px 8px;font-size:14px}
.swap{background:var(--soft);padding:12px 14px;margin:18px 0 0;font-size:16px;line-height:1.4}
.swap b{font:700 18px/1 var(--cond);display:block;margin-bottom:4px}
.opnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.opnav button{border:1.5px solid var(--ink);background:none;border-radius:4px;padding:10px 12px;text-align:left;font:600 17px/1.15 var(--cond);min-height:56px}
.opnav button small{display:block;font:400 12.5px/1.2 var(--body);color:var(--ink2);margin-bottom:3px}
.opnav button:last-child{text-align:right}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:10px 14px;font:600 17px/1 var(--cond);text-decoration:none}
.btn.ghost{background:none;color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}
.mapwrap{position:relative;z-index:1}
#map{height:58vh;min-height:320px;background:#dfe6e2;z-index:1}
.mapbar{background:var(--paper);border-bottom:1px solid var(--rule);padding:10px 0}
.locate{position:absolute;right:12px;bottom:26px;z-index:500;border:2px solid #000;background:#fff;border-radius:6px;padding:9px 12px;font:600 16px/1 var(--cond);box-shadow:0 1px 0 #000}
.pin{background:none;border:0}
.pin svg{width:34px;height:34px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55));transform-origin:50% 50%}
#map.far .pin svg{transform:scale(.8)}
.pin.shut svg{opacity:.5}
.leaflet-popup-content{margin:12px 14px;font:400 15px/1.35 var(--body);min-width:190px}
.leaflet-popup-content h3{font:700 21px/1.05 var(--cond);margin:0 0 4px}
.leaflet-popup-content .btn{margin-top:10px;padding:8px 12px;font-size:16px}
.leaflet-container{font-family:var(--body)}
.leaflet-container a.btn{color:#fff}
.me{width:16px;height:16px;border-radius:50%;background:#1F6FB8;border:3px solid #fff;box-shadow:0 0 0 2px #1F6FB8}
.key{padding:18px 16px 28px;max-width:760px;margin:0 auto}
.key h2{font-size:28px}
.key p{font-size:15px;line-height:1.4;color:var(--ink2);margin:4px 0 10px}
.key .steps{background:var(--card);border-bottom:1px solid var(--rule)}
.key .steps button{padding:8px 10px;grid-template-columns:34px 1fr auto}
.key .steps small{font:600 15px/1 var(--cond);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.key .steps small.q{font-weight:400;color:var(--ink2)}
.sec{padding:26px 0 6px}
.sec h2{font-size:32px;margin-bottom:8px}
.sec>p,.sec .lead{font-size:16.5px;color:var(--ink);max-width:36em}
.path{background:var(--card);border-top:2px solid var(--ink);padding:12px 12px 14px;margin:14px 0 0}
.path h3{font-size:23px}
.path p{font-size:15px;color:var(--ink2);margin:3px 0 10px}
.steps{display:flex;flex-direction:column;gap:0;list-style:none;margin:0;padding:0}
.steps li{border-top:1px solid var(--rule)}
.steps button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:8px 0;font:600 18.5px/1.1 var(--cond)}
.steps svg{width:30px;height:30px}
.steps small{font:400 13px/1 var(--body);color:var(--ink2)}
.table{width:100%;border-collapse:collapse;background:var(--card);margin-top:12px;font-size:15.5px;line-height:1.35}
.table th{font:600 14px/1.2 var(--cond);text-align:left;color:var(--ink2);padding:8px 10px;border-bottom:2px solid var(--ink);letter-spacing:.02em}
.table td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.table td:first-child{font:600 18px/1.15 var(--cond)}
.table button.lk{background:none;border:0;padding:0;font:inherit;text-align:left;text-decoration:underline;text-underline-offset:.15em}
.table .mini{font:400 12.5px/1.3 var(--body);color:var(--ink2);display:block;margin-top:3px}
details{background:var(--card);border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{list-style:none;cursor:pointer;padding:12px;font:700 21px/1.1 var(--cond);display:flex;align-items:center;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 26px/1 var(--body)}
details[open] summary::after{content:"-"}
details .in{padding:0 12px 12px}
.brk{list-style:none;margin:0;padding:0}
.brk li{padding:8px 0;border-top:1px solid var(--rule);font-size:15.5px;line-height:1.4}
.brk b{font:600 18px/1.15 var(--cond);display:block}
.brk small{color:var(--ink2);font-size:13px}
.tr{background:var(--card);border-top:2px solid var(--ink);margin-top:14px}
.tr .in{padding:12px}
.tr h3{font-size:24px;display:flex;align-items:center;gap:10px}
.tr h3 svg{width:30px;height:30px;flex:none}
.tr img{width:100%;height:auto;aspect-ratio:16/8;object-fit:cover;display:block}
.cols{display:grid;gap:14px}
.card{background:var(--card);border-top:2px solid var(--ink);padding:12px 12px 6px}
.card h3{font-size:23px;margin-bottom:6px}
.rub{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.35;background:var(--card);margin-top:10px}
.rub th,.rub td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
.rub th{font:600 16px/1.15 var(--cond)}
.rub thead th{border-bottom:2px solid var(--ink);color:var(--ink2);font-size:14px}
.rub td:first-child,.rub th:first-child{width:2.2em;text-align:center;font:700 17px/1.2 var(--cond)}
.formula{background:#000;color:#fff;padding:14px 14px;font:600 20px/1.3 var(--cond);margin:12px 0;letter-spacing:.01em}
.formula small{display:block;font:400 14px/1.4 var(--body);color:#C9D2CD;margin-top:6px}
.matrix{display:grid;grid-template-columns:18px repeat(6,1fr);gap:2px;margin-top:12px}
.matrix .ax{font:600 13.5px/1 var(--cond);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.matrix .cell{background:var(--card);min-height:44px;padding:3px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.matrix .cell button{background:none;border:0;padding:0;width:23px;height:23px}
.matrix .cell svg{width:23px;height:23px;display:block}
.axl{font:600 14px/1 var(--cond);color:var(--ink2);margin-top:8px;text-align:center}
.src{margin:8px 0 0;padding-left:1.1em;font-size:14.5px;line-height:1.45}
.src li{margin-bottom:6px}
.cred{font-size:13px;line-height:1.5;color:var(--ink2);columns:2;column-gap:20px;margin:8px 0 0;padding:0;list-style:none}
.cred li{break-inside:avoid;margin-bottom:6px}
#printroot{display:none}
.pfoot{display:none}
@media (max-width:359px){
.pips{flex-direction:column;align-items:flex-start;gap:5px}
.opts{gap:10px;font-size:13.5px}
.opts label{white-space:nowrap}
.opts .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.opts select{max-width:124px}
}
@media (min-width:600px){
.legend span{display:block}
.two{grid-template-columns:1fr 1fr}
.facts{grid-template-columns:repeat(3,1fr)}
.cols{grid-template-columns:1fr 1fr}
}
@media (min-width:900px){
body{padding-bottom:0;font-size:17.5px}
.tabs{position:fixed;top:0;bottom:auto;left:auto;right:150px;height:var(--bar);border:0;background:none;z-index:45;width:auto}
.tabs button{flex-direction:row;height:var(--bar);padding:0 16px;font-size:17px;gap:8px}
.tabs button[aria-current="page"]{box-shadow:inset 0 -4px 0 var(--l3)}
.wrap{max-width:820px}
.sheet{left:auto;top:var(--bar);width:min(560px,46vw);border-left:1px solid #000;box-shadow:-18px 0 40px rgba(0,0,0,.18)}
.sheetbar{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--rule)}
.sheetbar button{color:var(--ink)}
.sheetbar .rank{color:var(--ink2)}
.sheetbar :focus-visible{outline-color:#000}
body.has-sheet #view{margin-right:min(560px,46vw)}
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 380px}
#map{height:calc(100vh - var(--bar) - 58px)}

      var k = r.lat + ',' + r.lng, n = used[k] = (used[k] || 0) + 1;
      var m = L.marker([r.lat, r.lng + (n - 1) * 0.00028], { icon: pinIcon(r), title: r.name, alt: r.name + ', ' + LV[r.level].n, riseOnHover: true, zIndexOffset: (6 - r.level) * 10 }).addTo(mapObj);
      m.bindPopup(function () { return popupHtml(r); }, { maxWidth: 260 }); markers[r.slug] = m;
    });
    mapObj.on('locationfound', function (e) {
      if (meMarker) meMarker.setLatLng(e.latlng); else meMarker = L.marker(e.latlng, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false }).addTo(mapObj);
      var near = Object.keys(P).some(function (k) { return mapObj.distance(e.latlng, P[k].c) < 1500; });
      var b = $('#locate'); if (near) { mapObj.setView(e.latlng, 18); if (b) b.textContent = 'Find me'; } else if (b) b.textContent = 'You are not in a park yet';
    });
    mapObj.on('locationerror', function () { var b = $('#locate'); if (b) b.textContent = 'Location is off'; });
    fitPark(); far();
    setTimeout(function () { if (mapObj) { mapObj.invalidateSize(); fitPark(); far(); } }, 250);
  });
}
function fitPark() {
  if (!mapObj) return; var pts = R.filter(function (r) { return r.park === mPark; }).map(function (r) { return [r.lat, r.lng]; });
  mapObj.closePopup(); mapObj.fitBounds(window.L.latLngBounds(pts).pad(-0.06), { paddingTopLeft: [10, 24], paddingBottomRight: [10, 34], maxZoom: 18, animate: false });
}
function restyleMarkers() { if (!window.L) return; R.forEach(function (r) { if (markers[r.slug]) markers[r.slug].setIcon(pinIcon(r)); }); }

/* ---------- plan ---------- */
function stepBtn(slug) { var r = bySlug[slug]; return '<li><button data-ride="' + slug + '">' + sign(r.level, r.rank) + '<span>' + esc(r.name) + '</span><small>' + P[r.park].short + '</small></button></li>'; }
function splitsRows() {
  return R.filter(function (r) { return r.level >= 4; }).map(function (r) {
    var l = live[r.slug], extra = [];
    if (r.rs) extra.push('Rider Switch'); if (l && l.single) extra.push('single rider line');
    return '<tr><td><button class="lk" data-ride="' + r.slug + '">' + esc(r.name) + '</button><span class="mini">' + P[r.park].name + (extra.length ? '. ' + extra.join(', ') : '') + '</span></td><td>' + esc(r.swap || 'Wait nearby with a snack') + '</td></tr>';
  }).join('');
}
function viewPlan() {
  var h = '<div class="wrap">';
  h += '<section class="sec"><h2>Three ways to step up</h2><p>Each path runs from easy to hard for one kind of ride. Go one rung at a time, on different days if you can, and stop wherever it stops being fun.</p>';
  RG.stepups.forEach(function (s) { h += '<div class="path"><h3>' + s.t + '</h3><p>' + s.d + '</p><ol class="steps">' + s.s.map(stepBtn).join('') + '</ol></div>'; });
  h += '</section>';
  h += '<section class="sec"><h2>When the group splits</h2><p>For every ride past the line, here is something close by that he can do instead. Disney\'s Rider Switch covers a guest who is not riding and cannot wait alone: tell the Cast Member at the entrance with the whole group there, and the adult who waited boards afterward without queuing again.</p>' +
    '<table class="table"><thead><tr><th>They ride</th><th>He can</th></tr></thead><tbody id="splits">' + splitsRows() + '</tbody></table></section>';
  h += '<section class="sec"><h2>Sit-down breaks</h2><p>Shows and walk-throughs with no ride motion at all. Good between bigger rides, or while others are in a long line.</p>';
  Object.keys(P).forEach(function (k) { h += '<details><summary>' + P[k].name + '</summary><div class="in"><ul class="brk">' + RG.breaks[k].map(function (b) { return '<li><b>' + esc(b[0]) + ' <small>' + esc(b[1]) + '</small></b>' + esc(b[2]) + '</li>'; }).join('') + '</ul></div></details>'; });
  h += '</section>';
  h += '<section class="sec"><h2>Getting around</h2><p>Transport counts too. The Skyliner is the one to think about ahead of time.</p>';
  RG.transport.forEach(function (t) {
    h += '<div class="tr">' + (t.img ? '<img src="' + t.img.src + '" alt="' + esc(t.name) + '" loading="lazy" width="' + t.img.w + '" height="' + t.img.h + '"><p class="credit">Photo: ' + esc(t.img.by) + ', ' + esc(t.img.lic) + ', via <a href="' + esc(t.img.page) + '" target="_blank" rel="noopener">Wikimedia Commons</a>. Resized.</p>' : '') +
      '<div class="in"><h3>' + sign(t.level) + esc(t.name) + '</h3><p class="verdict" style="margin:8px 0 8px">' + esc(t.v) + '</p><p>' + esc(t.d) + '</p>' + (t.alert ? '<p class="alert">' + esc(t.alert) + '</p>' : '') +
      '<ul class="tips">' + t.tips.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div>';
  });
  h += '</section>';
  h += '<section class="sec"><h2>The basics</h2><div class="cols">' +
    '<div class="card"><h3>Keeping a stomach settled</h3><ul class="tips">' +
    '<li>Motion sickness starts when the eyes and the inner ear disagree. Screens that move while the seat does not are the worst case.</li>' +
    '<li>Face forward, sit toward the front, and look far ahead at something steady.</li>' +
    '<li>Sip water through the day. Eat small and plain before a Stretch ride, not a big meal.</li>' +
    '<li>No phone screens in the last stretch of a line or on anything that moves.</li>' +
    '<li>One motion ride, then a calm one. Queasiness stacks up.</li>' +
    '<li>Ask his doctor or pharmacist before the trip whether a motion-sickness medicine makes sense for him, and when to take it.</li></ul></div>' +
    '<div class="card"><h3>Making heights easier</h3><ul class="tips">' +
    '<li>Watch the ride run from the ground first. For indoor rides, watch a ride-through video together at home.</li>' +
    '<li>Pick the seat: lowest row, inside seat, front of the train where he can see what is coming.</li>' +
    '<li>Eyes out at the horizon, not down.</li>' +
    '<li>Tell him the number. Thirty feet sounds smaller once you know it is a three-story building.</li></ul></div>' +
    '<div class="card"><h3>He holds the veto</h3><ul class="tips">' +
    '<li>No is a full answer at any point before the ride starts, including at the loading platform. Tell a Cast Member and they will walk you to the exit.</li>' +
    '<li>Agree on a signal for mid-ride, like a hand squeeze, that means eyes closed and counting together.</li>' +
    '<li>A ride skipped today can be a ride tried on the next trip.</li></ul></div>' +
    '<div class="card"><h3>Closures to know</h3><ul class="tips">' +
    R.filter(function (r) { return r.alert && r.alert[0] !== 'info'; }).map(function (r) { return '<li><b>' + esc(r.name) + '.</b> ' + esc(r.alert[1]) + '</li>'; }).join('') +
    '<li><b>Walt Disney\'s Carousel of Progress.</b> Closed for a reimagining. Disney expects it back in late spring 2027.</li>' +
    '<li><b>Disney Skyliner.</b> Closed January 24 to 30, 2027 for annual maintenance.</li></ul><p class="small">Checked November 25, 2026. The live status on each ride is the final word on the day.</p></div>' +
    '</div></section></div>';
  return h;
}

/* ---------- method ---------- */
function viewMethod() {
  var ex = bySlug['mine-train'], w = ex.r.map(function (v, i) { return v * FACT[i][1]; }), peak = Math.max.apply(null, w), avg = w.reduce(function (a, b) { return a + b; }, 0) / 4.2;
  var h = '<div class="wrap"><section class="sec"><h2>How the scores work</h2><p>Every ride gets five scores from 0 to 5. They roll up into one number from 0 to 100, and that number sets the level. The scores are a judgment call, made the same way for every ride, from Disney\'s own published details, measured ride statistics and what motion-sensitive and height-wary riders report.</p>' +
    '<table class="rub"><thead><tr><th></th><th>Motion</th><th>Heights</th></tr></thead><tbody>' +
    '<tr><th>0</th><td>You are sitting still or walking</td><td>On the ground</td></tr>' +
    '<tr><th>1</th><td>Slow and steady: a boat, a train, a slow car</td><td>A little elevation or a brief climb with no view down</td></tr>' +
    '<tr><th>2</th><td>Gentle, with some turning, bouncing or backward travel</td><td>Clearly off the ground, but slow or brief</td></tr>' +
    '<tr><th>3</th><td>Steady circling, coaster turns, or a car that spins among screens</td><td>Open views from 30 to 60 feet, or sustained height on foot</td></tr>' +
    '<tr><th>4</th><td>A motion simulator, hard whips, or backward coaster track</td><td>Feet dangling or a tall open lift hill</td></tr>' +
    '<tr><th>5</th><td>Fast spinning, a centrifuge, or rotation at coaster speed</td><td>Height is the point: a tower, or open rockets on a rooftop</td></tr></tbody></table>' +
    '<table class="rub"><thead><tr><th></th><th>Drops</th><th>Speed and force</th><th>Dark and startle</th></tr></thead><tbody>' +
    '<tr><th>1</th><td>A gentle dip</td><td>Walking to jogging pace</td><td>Dim, or one loud moment</td></tr>' +
    '<tr><th>2</th><td>One short drop, 15 to 30 ft</td><td>Up to about 25 mph</td><td>Dark stretches or loud effects</td></tr>' +
    '<tr><th>3</th><td>Coaster drops of 30 to 50 ft</td><td>25 to 40 mph</td><td>Dark with startles or spooky scenes</td></tr>' +
    '<tr><th>4</th><td>A big drop, 50 ft or more</td><td>40 to 65 mph or a hard launch</td><td>Sustained menace in the dark</td></tr>' +
    '<tr><th>5</th><td>Free fall, repeated</td><td>Going upside down, or 4 G and up</td><td>Not used at Disney World</td></tr></tbody></table>' +
    '<div class="formula">Score = 20 x (0.8 x worst factor + 0.2 x average)<small>Motion and Heights count in full. Drops and Speed count at 80 percent. Dark and startle counts at 60 percent. The worst factor dominates because one bad trigger is enough to spoil a ride.</small></div>' +
    '<p class="small">Worked example, ' + esc(ex.name) + ': scores ' + ex.r.join(', ') + ' become weighted ' + w.map(fmtNum).join(', ') + '. Worst is ' + fmtNum(peak) + ', average is ' + (Math.round(avg * 100) / 100) + ', so 20 x (0.8 x ' + fmtNum(peak) + ' + 0.2 x ' + (Math.round(avg * 100) / 100) + ') = ' + Math.round(ex.score) + '.</p></section>';
  h += '<section class="sec"><h2>The five levels</h2><table class="table"><tbody>';
  for (var i = 1; i <= 5; i++) h += '<tr><td style="width:44px">' + sign(i) + '</td><td><b style="font:700 20px/1 var(--cond)">' + LV[i].n + '</b><span class="mini">Score ' + LV[i].range + '. ' + LV[i].d + ' ' + R.filter(function (r) { return r.level === i; }).length + ' rides.</span></td></tr>';
  h += '</tbody></table></section>';
  h += '<section class="sec"><h2>Where every ride lands</h2><p>Motion runs left to right, heights bottom to top, both rounded to whole numbers. The bottom-left corner is the comfort zone. Tap a sign to open that ride.</p><div class="matrix" role="table" aria-label="Rides by motion and heights score">';
  for (var hh = 5; hh >= 0; hh--) {
    h += '<div class="ax">' + hh + '</div>';
    for (var mm = 0; mm <= 5; mm++) {
      var cell = R.filter(function (r) { return Math.min(5, Math.floor(r.r[0] + 0.5)) === mm && Math.min(5, Math.floor(r.r[1] + 0.5)) === hh; });
      h += '<div class="cell">' + cell.map(function (r) { return '<button data-ride="' + r.slug + '" title="' + esc(r.name) + '" aria-label="' + esc(r.name) + ', ' + LV[r.level].n + '">' + sign(r.level, r.rank) + '</button>'; }).join('') + '</div>';
    }
  }
  h += '<div class="ax"></div>'; for (var m2 = 0; m2 <= 5; m2++) h += '<div class="ax">' + m2 + '</div>';
  h += '</div><p class="axl">Motion score, 0 to 5 across. Heights score, 0 to 5 up the side.</p></section>';
  h += '<section class="sec"><h2>Where the facts come from</h2><ul class="src">' +
    '<li><a href="https://cdn1.parksmedia.wdprapps.disney.com/vision-dam/digital/parks-platform/parks-global-assets/disney-world/guest-services/accessibility/sensory-experience/WDW-Sensory-Experience-Details-FINAL-6-26.pdf" target="_blank" rel="noopener">Disney\'s Sensory Experience Details, June 2026</a>: what each ride is flagged for, restraints and ride times.</li>' +
    '<li><a href="https://disneyworld.disney.go.com/attractions/" target="_blank" rel="noopener">Disney\'s attraction pages and filters</a>, read November 25, 2026: height rules, ride tags, the health advisory list, closures.</li>' +
    '<li><a href="https://disneyworld.disney.go.com/guest-services/rider-switch/" target="_blank" rel="noopener">Disney\'s Rider Switch page</a>: which rides offer it and how it works.</li>' +
    '<li><a href="https://themeparks.wiki/" target="_blank" rel="noopener">themeparks.wiki</a>: live wait times, open or closed status and map positions.</li>' +
    '<li><a href="https://rcdb.com/" target="_blank" rel="noopener">Roller Coaster DataBase</a> and Wikipedia: speeds, heights and drops. Each one-pager says which.</li>' +
    '<li><a href="https://allears.net/walt-disney-world/wdw-planning/motion-sensitivity" target="_blank" rel="noopener">AllEars motion sensitivity table</a>, <a href="https://wdwprepschool.com/disney-world-motion-sickness/" target="_blank" rel="noopener">WDW Prep School</a>, <a href="https://dadsguidetowdw.com/?p=45858" target="_blank" rel="noopener">Dad\'s Guide to WDW</a> and <a href="https://touringplans.com/blog/?p=240699" target="_blank" rel="noopener">TouringPlans</a>: what motion-sensitive and height-wary riders report, and seat tips.</li>' +
    '<li><a href="https://plandisney.disney.go.com/question/wondering-high-rows-soarin-go-403774" target="_blank" rel="noopener">planDisney</a>: how high each row of Soarin\' lifts.</li>' +
    '<li><a href="https://wwwnc.cdc.gov/travel/page/motion-sickness" target="_blank" rel="noopener">CDC travel health: motion sickness</a>: the general advice on the Plan tab.</li>' +
    '<li><a href="https://www.disneytouristblog.com/disney-world-refurbishments/" target="_blank" rel="noopener">Disney Tourist Blog refurbishment calendar</a>: cross-check on closure dates.</li></ul>' +
    '<p class="small">Ratings and wording are this guide\'s own. Unofficial, made by a family for a family, and not affiliated with or endorsed by The Walt Disney Company. Ride names belong to their owners. Last checked ' + 'November 25, 2026.</p>' +
    '<div class="links"><button class="btn" id="printall">Print every one-pager</button><button class="btn ghost" id="offline">Save photos for offline use (5 MB)</button></div></section>';
  var seen = {}, cr = [];
  R.forEach(function (r) { if (r.img && !seen[r.img.src]) { seen[r.img.src] = 1; cr.push('<li>' + esc(r.name.replace(/ \((Green|Orange)\)/, '')) + ': <a href="' + esc(r.img.page) + '" target="_blank" rel="noopener">' + esc(r.img.by) + '</a>, ' + esc(r.img.lic) + '</li>'); } });
  RG.transport.forEach(function (t) { if (t.img) cr.push('<li>' + esc(t.name) + ': <a href="' + esc(t.img.page) + '" target="_blank" rel="noopener">' + esc(t.img.by) + '</a>, ' + esc(t.img.lic) + '</li>'); });
  h += '<section class="sec"><h2>Photo credits</h2><p class="small">All photos come from Wikimedia Commons under free licenses and were resized. Map tiles are from OpenStreetMap contributors.</p><ul class="cred">' + cr.join('') + '</ul></section></div>';
  return h;
}

/* ---------- print ---------- */
function printRides(list) {
  var root = $('#printroot'); root.innerHTML = list.map(function (r) { return onepager(r, true); }).join('');
  document.body.classList.add('printing');
  var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
  var wait = Promise.all(imgs.map(function (im) { return im.complete ? 1 : new Promise(function (ok) { im.onload = im.onerror = ok; }); }));
  var t = new Promise(function (ok) { setTimeout(ok, 8000); });
  Promise.race([wait, t]).then(function () { window.print(); });
}
window.addEventListener('beforeprint', function () {
  if (!document.body.classList.contains('printing') && sheetSlug) { $('#printroot').innerHTML = onepager(bySlug[sheetSlug], true); document.body.classList.add('printing'); }
});
window.addEventListener('afterprint', function () { $('#printroot').innerHTML = ''; document.body.classList.remove('printing'); });

function saveOffline(btn) {
  if (!('caches' in window)) { btn.textContent = 'Not supported in this browser'; return; }
  var urls = ['vendor/leaflet.js', 'vendor/leaflet.css'], seen = {};
  R.forEach(function (r) { if (r.img && !seen[r.img.src]) { seen[r.img.src] = 1; urls.push(r.img.src); } });
  RG.transport.forEach(function (t) { if (t.img) urls.push(t.img.src); });
  var done = 0; btn.disabled = true; btn.textContent = 'Saving 0 of ' + urls.length;
  caches.open('rg-v1').then(function (c) {
    return Promise.all(urls.map(function (u) {
      return c.match(u).then(function (m) { return m || fetch(u).then(function (res) { if (res.ok) return c.put(u, res); }); }).then(function () { done++; btn.textContent = 'Saving ' + done + ' of ' + urls.length; });
    }));
  }).then(function () { btn.textContent = 'Saved. Photos and map code now work offline.'; }).catch(function () { btn.disabled = false; btn.textContent = 'Could not save. Try again on Wi-Fi.'; });
}

/* ---------- shell + routing ---------- */
var view = null;
var TABS = [['rides', 'Rides', '<path d="M4 6h16M4 12h16M4 18h10"/>'], ['map', 'Map', '<path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'], ['plan', 'Plan', '<path d="M6 20V10M12 20V4M18 20v-7"/>'], ['method', 'Method', '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>']];
function drawTabs() { $('#tabs').innerHTML = TABS.map(function (t) { return '<button data-tab="' + t[0] + '"' + (view === t[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + t[2] + '</svg>' + t[1] + '</button>'; }).join(''); }
function render() {
  var v = $('#view'); if (mapObj) { mapObj.remove(); mapObj = null; markers = {}; meMarker = null; }
  v.innerHTML = view === 'map' ? viewMap() : view === 'plan' ? viewPlan() : view === 'method' ? viewMethod() : viewRides();
  drawTabs(); window.scrollTo(0, 0);
  if (view === 'rides') { var s = $('#fsort'); if (s) s.value = fSort; drawList(); }
  if (view === 'map') { drawKey(); initMap(); }
}
function route() {
  var p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'ride' && bySlug[p[1]]) { if (!view) { view = 'rides'; render(); } openSheet(p[1]); return; }
  closeSheet();
  var v = ['rides', 'map', 'plan', 'method'].indexOf(p[0]) >= 0 ? p[0] : 'rides';
  if (v !== view) { view = v; render(); }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-ride],[data-pin],[data-tab],[data-park],[data-go],[data-print],#sheetback,#livebtn,#locate,#printall,#offline'); if (!t) return;
  if (t.dataset.pin) { showPin(t.dataset.pin); }
  else if (t.dataset.ride) { e.preventDefault(); depth++; location.hash = '#/ride/' + t.dataset.ride; }
  else if (t.dataset.tab) { location.hash = '#/' + t.dataset.tab; }
  else if (t.dataset.go) { history.replaceState(null, '', '#/ride/' + t.dataset.go); openSheet(t.dataset.go); }
  else if (t.dataset.print) { printRides([bySlug[t.dataset.print]]); }
  else if (t.id === 'printall') { printRides(R); }
  else if (t.id === 'offline') { saveOffline(t); }
  else if (t.id === 'sheetback') { if (depth > 0) { depth--; history.back(); } else location.hash = '#/' + (view || 'rides'); }
  else if (t.id === 'livebtn') { loadLive(); }
  else if (t.id === 'locate') { if (mapObj) { t.textContent = 'Finding you'; mapObj.locate({ enableHighAccuracy: true, timeout: 12000 }); } }
  else if (t.dataset.park) {
    var box = t.parentNode.id;
    if (box === 'pf') { fPark = t.dataset.park; store.set('park', fPark); drawList(); } else { mPark = t.dataset.park; store.set('mpark', mPark); fitPark(); drawKey(); }
    Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute('aria-pressed', b === t); });
  }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fopen') { fOpen = e.target.checked; store.set('open', fOpen); drawList(); }
  if (e.target.id === 'fsort') { fSort = e.target.value; store.set('sort', fSort); drawList(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetSlug) $('#sheetback').click(); });
window.addEventListener('hashchange', route);
route(); paintLive(); loadLive();
setInterval(function () { if (!document.hidden) loadLive(); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', function () { if (!document.hidden && (!liveAt || Date.now() - liveAt > 4 * 60 * 1000)) loadLive(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
